<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">NERO Design Team 3.0</title>
  <desc id="desc">A governed design operating system for coding agents, showing the route, reuse, render, and verify workflow.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafb"/>
      <stop offset="1" stop-color="#eef2f3"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f4e5f" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#16212b" flood-opacity=".11"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#paper)"/>
  <rect width="1280" height="640" rx="28" fill="url(#grid)"/>
  <path d="M0 0h18v640H0z" fill="#1f4e5f"/>
  <path d="M18 0h4v640h-4z" fill="#c6a15b"/>

  <g font-family="Inter, Aptos, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(76 72)">
      <g transform="translate(0 0)">
        <rect width="48" height="48" rx="8" fill="#1f4e5f"/>
        <path d="M13 34V14h5l12 12V14h5v20h-5L18 22v12z" fill="#f8fafb"/>
      </g>
      <text x="64" y="19" fill="#1d252c" font-size="16" font-weight="700" letter-spacing="2.6">NERO DESIGN TEAM 3.0</text>
      <text x="64" y="42" fill="#53616b" font-size="12" font-weight="600" letter-spacing="1.8">PUBLIC DERIVATIVE · PLACEHOLDER IDENTITY</text>

      <text x="0" y="142" fill="#1d252c" font-size="56" font-weight="750" letter-spacing="-2.4">Design judgment</text>
      <text x="0" y="205" fill="#1d252c" font-size="56" font-weight="750" letter-spacing="-2.4">for coding agents.</text>
      <text x="2" y="252" fill="#53616b" font-size="22" font-weight="450">Route the work. Reuse the system. Verify the result.</text>

      <g transform="translate(0 304)">
        <rect width="112" height="40" rx="20" fill="#1f4e5f"/>
        <text x="56" y="26" text-anchor="middle" fill="#f4f8fa" font-size="13" font-weight="700" letter-spacing="1.4">ROUTE</text>
        <path d="M126 20h25" stroke="#aebbc3" stroke-width="2"/>
        <path d="m145 14 7 6-7 6" fill="none" stroke="#aebbc3" stroke-width="2"/>
        <rect x="166" width="112" height="40" rx="20" fill="#ffffff" stroke="#aebbc3"/>
        <text x="222" y="26" text-anchor="middle" fill="#1f4e5f" font-size="13" font-weight="700" letter-spacing="1.4">REUSE</text>
        <path d="M292 20h25" stroke="#aebbc3" stroke-width="2"/>
        <path d="m311 14 7 6-7 6" fill="none" stroke="#aebbc3" stroke-width="2"/>
        <rect x="332" width="112" height="40" rx="20" fill="#ffffff" stroke="#aebbc3"/>
        <text x="388" y="26" text-anchor="middle" fill="#1f4e5f" font-size="13" font-weight="700" letter-spacing="1.4">RENDER</text>
        <path d="M458 20h25" stroke="#aebbc3" stroke-width="2"/>
        <path d="m477 14 7 6-7 6" fill="none" stroke="#aebbc3" stroke-width="2"/>
        <rect x="498" width="112" height="40" rx="20" fill="#ffffff" stroke="#aebbc3"/>
        <text x="554" y="26" text-anchor="middle" fill="#1f4e5f" font-size="13" font-weight="700" letter-spacing="1.4">VERIFY</text>
      </g>

      <g transform="translate(0 426)">
        <text x="0" y="0" fill="#1d252c" font-size="27" font-weight="750">12</text>
        <text x="44" y="0" fill="#53616b" font-size="13" font-weight="650" letter-spacing="1">ASSETS</text>
        <path d="M178-22v30" stroke="#dce4e8"/>
        <text x="204" y="0" fill="#1d252c" font-size="27" font-weight="750">16</text>
        <text x="248" y="0" fill="#53616b" font-size="13" font-weight="650" letter-spacing="1">RECIPES</text>
        <path d="M344-22v30" stroke="#dce4e8"/>
        <text x="370" y="0" fill="#1d252c" font-size="27" font-weight="750">9</text>
        <text x="414" y="0" fill="#53616b" font-size="13" font-weight="650" letter-spacing="1">PUBLIC CASES</text>
      </g>
    </g>

    <g transform="translate(760 72)" filter="url(#shadow)">
      <rect width="444" height="496" rx="22" fill="#ffffff" stroke="#dce4e8"/>
      <rect x="1" y="1" width="442" height="72" rx="21" fill="#16212b"/>
      <path d="M1 52h442v21H1z" fill="#16212b"/>
      <circle cx="28" cy="28" r="5" fill="#c6a15b"/>
      <text x="46" y="34" fill="#f4f8fa" font-size="14" font-weight="700" letter-spacing="1.1">DELIVERY PIPELINE</text>
      <rect x="318" y="19" width="96" height="26" rx="13" fill="#b7791f"/>
      <text x="366" y="36" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="750" letter-spacing="1.2">CANDIDATE</text>

      <g transform="translate(28 104)">
        <text x="0" y="0" fill="#667680" font-size="11" font-weight="700" letter-spacing="1.7">01 · REQUEST</text>
        <text x="0" y="28" fill="#1d252c" font-size="19" font-weight="700">Evidence-led research dashboard</text>
        <text x="0" y="52" fill="#53616b" font-size="13">Dense UI · restrained motion · explicit sources</text>

        <g transform="translate(0 86)">
          <rect width="388" height="72" rx="12" fill="#f5f7f8" stroke="#dce4e8"/>
          <rect x="16" y="16" width="40" height="40" rx="9" fill="#1f4e5f"/>
          <path d="m30 36 8 8 14-17" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="72" y="31" fill="#1d252c" font-size="14" font-weight="700">Route selected</text>
          <text x="72" y="51" fill="#53616b" font-size="12">frontend-ui · high density · low motion</text>
        </g>

        <g transform="translate(0 174)">
          <rect width="188" height="86" rx="12" fill="#ffffff" stroke="#dce4e8"/>
          <text x="16" y="25" fill="#667680" font-size="10" font-weight="700" letter-spacing="1.3">REGISTRY</text>
          <text x="16" y="55" fill="#1d252c" font-size="24" font-weight="750">Reuse by task</text>
          <text x="16" y="74" fill="#53616b" font-size="11">tokens · rule · template · case</text>
          <rect x="200" width="188" height="86" rx="12" fill="#ffffff" stroke="#dce4e8"/>
          <text x="216" y="25" fill="#667680" font-size="10" font-weight="700" letter-spacing="1.3">RUNTIME</text>
          <text x="216" y="55" fill="#1d252c" font-size="24" font-weight="750">local-first</text>
          <text x="216" y="74" fill="#53616b" font-size="11">exact text and deterministic checks</text>
        </g>

        <g transform="translate(0 278)">
          <text x="0" y="0" fill="#667680" font-size="11" font-weight="700" letter-spacing="1.7">04 · GATES</text>
          <g transform="translate(0 18)">
            <rect width="122" height="34" rx="8" fill="#e7f5ef"/>
            <circle cx="18" cy="17" r="5" fill="#087f5b"/>
            <text x="32" y="22" fill="#1d252c" font-size="12" font-weight="650">Visual QA</text>
            <rect x="132" width="122" height="34" rx="8" fill="#e7f5ef"/>
            <circle cx="150" cy="17" r="5" fill="#087f5b"/>
            <text x="164" y="22" fill="#1d252c" font-size="12" font-weight="650">Boundary</text>
            <rect x="264" width="124" height="34" rx="8" fill="#fff6df"/>
            <circle cx="282" cy="17" r="5" fill="#b7791f"/>
            <text x="296" y="22" fill="#1d252c" font-size="12" font-weight="650">Candidate</text>
          </g>
        </g>

        <path d="M0 354h388" stroke="#dce4e8"/>
        <text x="0" y="386" fill="#53616b" font-size="12">No private media · no inferred adoption · no auto-publish</text>
      </g>
    </g>
  </g>
</svg>
