<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>留白杂志风 Overlay</title>
  <link rel="stylesheet" href="theme/nero-tokens.css" />
  <style>
    :root {
      --paper: #f2ebdd;
      --ink: var(--nero-color-text-primary, #1d252c);
      --muted: var(--nero-color-text-muted, #6f716e);
      --accent: var(--nero-color-brand-primary, #1f4e5f);
      --hairline: rgba(29, 37, 44, 0.28);
      --visual-url: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #d8d8d5;
      color: var(--ink);
      font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", Georgia, serif;
    }

    .canvas {
      position: relative;
      width: min(96vw, 1080px);
      aspect-ratio: 3 / 5;
      overflow: hidden;
      background:
        linear-gradient(rgba(242, 235, 221, 0.74), rgba(242, 235, 221, 0.74)),
        var(--visual-url),
        radial-gradient(circle at 27% 71%, rgba(22, 93, 255, 0.86) 0 5%, transparent 5.4%),
        var(--paper);
      background-size: cover;
      background-position: center;
      box-shadow: 0 24px 80px rgba(20, 24, 26, 0.18);
      isolation: isolate;
    }

    .canvas::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.28;
      background-image:
        repeating-linear-gradient(0deg, transparent 0 8px, rgba(29, 37, 44, 0.025) 8px 9px),
        radial-gradient(circle at 20% 30%, rgba(29, 37, 44, 0.12) 0 1px, transparent 1.4px);
      background-size: auto, 31px 37px;
      mix-blend-mode: multiply;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(16, 1fr);
      padding: 8.8%;
    }

    .eyebrow {
      grid-column: 1 / 6;
      grid-row: 2;
      align-self: start;
      font: 500 clamp(10px, 1.35vw, 18px)/1.3 ui-monospace, "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .title {
      grid-column: 1 / 8;
      grid-row: 11 / 14;
      align-self: end;
      margin: 0;
      max-width: 9em;
      font-size: clamp(32px, 6.1vw, 76px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: 0.02em;
    }

    .meta {
      grid-column: 1 / 7;
      grid-row: 15;
      align-self: end;
      padding-top: 1.2em;
      border-top: 1px solid var(--hairline);
      font: 500 clamp(9px, 1.15vw, 15px)/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .source {
      grid-column: 8 / 13;
      grid-row: 15;
      align-self: end;
      text-align: right;
      font: 400 clamp(8px, 0.95vw, 13px)/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace;
      color: var(--muted);
    }

    .accent-rule {
      position: absolute;
      left: 8.8%;
      bottom: 8.8%;
      width: 3.2%;
      height: 4px;
      background: var(--accent);
    }

    .canvas[data-format="social-4x5"] {
      width: min(96vw, 1080px);
      aspect-ratio: 4 / 5;
    }

    .canvas[data-format="social-1x1"] {
      width: min(94vw, 1080px);
      aspect-ratio: 1;
    }

    .canvas[data-format="slide-16x9"] {
      width: min(96vw, 1440px);
      aspect-ratio: 16 / 9;
    }

    .canvas[data-format="slide-16x9"] .overlay {
      grid-template-rows: repeat(9, 1fr);
      padding: 5.6%;
    }

    .canvas[data-format="slide-16x9"] .title {
      grid-column: 1 / 7;
      grid-row: 5 / 8;
      font-size: clamp(38px, 5vw, 72px);
    }

    .canvas[data-format="slide-16x9"] .meta,
    .canvas[data-format="slide-16x9"] .source {
      grid-row: 9;
    }

    .canvas[data-format="slide-16x9"] .accent-rule {
      left: 5.6%;
      bottom: 5.6%;
    }
  </style>
</head>
<body>
  <main class="canvas" data-format="poster-3x5" aria-label="Minimal zine editorial exact-text overlay template">
    <section class="overlay">
      <div class="eyebrow" data-field="eyebrow">NERO EDITORIAL / 01</div>
      <h1 class="title" data-field="title">一页尚未被写满的风景</h1>
      <div class="meta" data-field="meta">2026.07 / VERIFIED TEXT LAYER</div>
      <div class="source" data-field="source">来源：替换为项目真实来源</div>
    </section>
    <div class="accent-rule" aria-hidden="true"></div>
  </main>

  <script>
    const content = {
      format: "poster-3x5",
      eyebrow: "NERO EDITORIAL / 01",
      title: "一页尚未被写满的风景",
      meta: "2026.07 / VERIFIED TEXT LAYER",
      source: "来源：替换为项目真实来源",
      generatedVisualUrl: ""
    };

    const canvas = document.querySelector(".canvas");
    canvas.dataset.format = content.format;
    for (const [field, value] of Object.entries(content)) {
      const node = document.querySelector(`[data-field="${field}"]`);
      if (node) node.textContent = value;
    }
    if (content.generatedVisualUrl) {
      canvas.style.setProperty("--visual-url", `url("${content.generatedVisualUrl}")`);
    }
  </script>
</body>
</html>
